services:
  postgres:
    image: postgres:16-alpine
    container_name: spe4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: projet_spe4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d projet_spe4"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: spe4_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://user:password@postgres:5432/projet_spe4?schema=public
      JWT_SECRET: dev-secret-change-me-in-production-please
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: spe4_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
